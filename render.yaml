services:
  - type: web
    name: fieldwork-nfl
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && npm ci --include=dev && npm run build
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: NODE_VERSION
        value: 24.19.0
      - key: ODDS_API_KEY
        sync: false
